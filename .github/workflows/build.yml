name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36
        pip install buildozer==1.5.1
    
    - name: Build APK with Buildozer
      run: |
        echo "y" | buildozer android debug 2>&1 | tee build.log
      continue-on-error: true
    
    - name: Check build result
      run: |
        if ls bin/*.apk 2>/dev/null; then
          echo "APK built successfully!"
          ls -la bin/
        else
          echo "Build failed, checking logs..."
          tail -200 build.log
          exit 1
        fi
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: smart-daily-checklist-apk
        path: bin/*.apk
